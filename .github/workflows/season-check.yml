# The app rotates its own seasons from the device clock — nothing needs to run
# for 中秋 or 圣诞 to arrive. This job exists for the one thing a clock cannot
# do: notice that a festival is close and under-stocked, and tell a human.
#
# Free by design: GitHub Actions is free on public repos, and this uses only
# the built-in GITHUB_TOKEN. No API keys, no paid services, no third-party
# actions beyond actions/checkout and setup-node.
#
# It deliberately does NOT try to draw the furniture. Three of the twenty-one
# hand-drawn pieces had to be redrawn — a bed that read as a fragment, roses
# that read as a lollipop, a zongzi that read as a tent — and every automated
# test passed on all three. Bad art is only visible by looking at it, so the
# design step stays with a person who can look.
name: Seasonal content

on:
  schedule:
    - cron: '0 1 1 * *'      # 1st of each month, 09:00 SGT
    - cron: '0 1 15 * *'     # and mid-month, so a 45-day lead is never missed
  workflow_dispatch:
    inputs:
      lead_days:
        description: 'How far ahead to look (days)'
        default: '45'
  push:
    paths: ['app.js', 'tools/season-check.js', 'tools/season-plan.js']

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: app.js parses
        run: node --check app.js

      # Fails the run (and emails you) only if the lunar table is running out —
      # that one silently breaks 新年/中秋/端午. Thin seasons only report.
      - name: Health check
        run: node tools/season-check.js

      - name: Plan the next season
        id: plan
        env:
          LEAD_DAYS: ${{ github.event.inputs.lead_days || '45' }}
        run: |
          node tools/season-plan.js | tee plan.txt
          node tools/season-plan.js --json > season-plan.json
          {
            echo "needs_work=$(node -p "require('./season-plan.json').needsWork")"
            echo "season=$(node -p "(require('./season-plan.json').due[0]||{}).season||''")"
            echo "want=$(node -p "(require('./season-plan.json').due[0]||{}).want||0")"
            echo "days=$(node -p "(require('./season-plan.json').due[0]||{}).opensIn||0")"
          } >> "$GITHUB_OUTPUT"
          { echo '### 季节家具计划'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Tell me a season needs furniture
        if: steps.plan.outputs.needs_work == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SEASON: ${{ steps.plan.outputs.season }}
          WANT:   ${{ steps.plan.outputs.want }}
          DAYS:   ${{ steps.plan.outputs.days }}
        run: |
          gh label create seasonal --color C2417A --description "季节限定内容" || true
          # One open issue per season — never nag twice for the same festival.
          if gh issue list --state open --label seasonal --json title --jq '.[].title' | grep -qF "$SEASON"; then
            echo "already raised for $SEASON"
            exit 0
          fi
          node tools/season-plan.js --issue > issue-body.md
          gh issue create --title "🎨 $SEASON 还有 $DAYS 天上架，还差 $WANT 件家具" \
                          --label seasonal --body-file issue-body.md
